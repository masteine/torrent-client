name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x86_64
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: windows-2025
            platform: windows-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Update Rust
        run: rustup update stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev
      - name: Build
        run: cargo build --release --locked --bin simple-torrent-gui
      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p 'stage/Simple Torrent.app/Contents/MacOS'
          cp target/release/simple-torrent-gui 'stage/Simple Torrent.app/Contents/MacOS/simple-torrent-gui'
          cat > 'stage/Simple Torrent.app/Contents/Info.plist' <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Simple Torrent</string>
            <key>CFBundleDisplayName</key><string>Простий торрент-клієнт</string>
            <key>CFBundleIdentifier</key><string>app.simple-torrent</string>
            <key>CFBundleExecutable</key><string>simple-torrent-gui</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>1</string>
          </dict></plist>
          PLIST
          ditto -c -k --keepParent 'stage/Simple Torrent.app' 'simple-torrent-${{ matrix.platform }}.zip'
      - name: Package Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: tar -C target/release -czf 'simple-torrent-${{ matrix.platform }}.tar.gz' simple-torrent-gui
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/simple-torrent-gui.exe -DestinationPath 'simple-torrent-${{ matrix.platform }}.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: simple-torrent-${{ matrix.platform }}
          path: simple-torrent-${{ matrix.platform }}.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: simple-torrent-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
